<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deal Brain</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f6f5c'/%3E%3Cpath d='M9 22V10h6.5a5.5 5.5 0 0 1 0 11H9' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f6f2; --panel:#ffffff; --ink:#1d1d1b; --muted:#6b6a64; --faint:#9a988f; --line:#e6e3da; --soft:#f0eee7;
  --accent:#1f6f5c; --accent-ink:#ffffff; --accent-soft:#e3f0ec; --warn:#a1520f; --warn-soft:#fbf0e4; --bad:#b3261e;
  --user:#ece9e0; --c1:#1f6f5c; --c2:#c07a2c; --c3:#5a6fb0;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 18px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#161614; --panel:#1f1f1c; --ink:#ecebe6; --muted:#a8a69d; --faint:#7d7b73; --line:#33322e; --soft:#272724;
  --accent:#5cc2a6; --accent-ink:#0f1f1a; --accent-soft:#1d332d; --warn:#e3a35c; --warn-soft:#33281b; --bad:#f2847b;
  --user:#2b2a26; --c1:#5cc2a6; --c2:#e3a35c; --c3:#8fa2e0; --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#161614; --panel:#1f1f1c; --ink:#ecebe6; --muted:#a8a69d; --faint:#7d7b73; --line:#33322e; --soft:#272724;
  --accent:#5cc2a6; --accent-ink:#0f1f1a; --accent-soft:#1d332d; --warn:#e3a35c; --warn-soft:#33281b; --bad:#f2847b;
  --user:#2b2a26; --c1:#5cc2a6; --c2:#e3a35c; --c3:#8fa2e0; --shadow:none;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,textarea,input{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:260px 1fr;height:100dvh}
/* sidebar */
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 12px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.logo svg{width:18px;height:18px}
.brand b{font-size:16px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:-2px}
.newchat{margin:4px 12px 10px;padding:9px 12px;border:1px solid var(--line);background:var(--panel);border-radius:10px;cursor:pointer;display:flex;gap:8px;align-items:center;font-weight:500}
.newchat:hover{border-color:var(--faint)}
.chats{flex:1;overflow:auto;padding:0 8px 8px}
.chats h4{margin:10px 8px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600}
.chat-item{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;border:0;background:none;cursor:pointer;color:var(--ink);font-size:14px}
.chat-item span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item:hover{background:var(--soft)}
.chat-item.on{background:var(--accent-soft)}
.chat-item .x{opacity:0;border:0;background:none;cursor:pointer;color:var(--faint);padding:0 2px}
.chat-item:hover .x{opacity:1}
.sidefoot{border-top:1px solid var(--line);padding:12px 16px;font-size:12px;color:var(--muted);display:grid;gap:6px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
.dot.stale{background:var(--warn)}
/* main */
.main{display:flex;flex-direction:column;min-height:0;min-width:0}
.top{display:none;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.top b{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:9px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
.scroll{flex:1;overflow:auto;padding:24px 16px 8px}
.thread{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.banner{max-width:820px;margin:0 auto 16px;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:14px}
.empty{max-width:760px;margin:6vh auto 0;text-align:center}
.empty h1{font-size:28px;letter-spacing:-.02em;margin:0 0 6px;font-weight:650}
.empty p{color:var(--muted);margin:0 0 24px}
.suggest{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.suggest button{text-align:left}
.suggest button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:14px;line-height:1.4;box-shadow:var(--shadow)}
.suggest button:hover{border-color:var(--accent)}
.suggest small{display:block;color:var(--faint);font-size:12px;margin-bottom:2px}
.q{align-self:flex-end;max-width:80%;background:var(--user);padding:10px 14px;border-radius:16px 16px 4px 16px;white-space:pre-wrap;word-wrap:break-word}
.a{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.a .answer p{margin:0 0 8px}
.a .answer p:first-child{font-size:17px;line-height:1.45;font-weight:500}
.a .answer ul{margin:6px 0 8px;padding-left:20px}
.a .answer li{margin:3px 0}
.a .answer .scope{color:var(--muted);font-size:13px;margin-bottom:10px}
.a .answer .take{background:var(--accent-soft);border-radius:8px;padding:8px 10px;margin-top:10px;font-size:14px}
.a .answer .take b{color:var(--accent);margin-right:6px}
.a .answer code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:13px}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:p 1.1s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.err{color:var(--bad)}
.block{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.block-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.block-h .sp{flex:1}
.link{border:0;background:none;color:var(--accent);cursor:pointer;font-size:12px;font-weight:600;padding:2px 4px;text-transform:none;letter-spacing:0}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .lbl{fill:var(--ink)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tablewrap{overflow:auto;max-height:340px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;max-width:420px}
th{position:sticky;top:0;background:var(--soft);font-weight:600;cursor:pointer;white-space:nowrap;user-select:none}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td .clip{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;text-decoration:none;color:var(--ink);background:var(--panel)}
.chip:hover{border-color:var(--accent)}
.chip em{font-style:normal;color:var(--faint);font-size:11px}
pre.sql{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:12px;overflow:auto;white-space:pre-wrap;margin:6px 0 0;max-height:260px}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;font-size:12px;color:var(--faint)}
.foot .sp{flex:1}
.fb{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 9px;cursor:pointer;font-size:13px}
.fb[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.follow{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.follow button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px}
.follow button:hover{border-color:var(--accent)}
.correct{display:none;margin-top:10px;gap:8px}
.correct.on{display:flex}
.correct input{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;min-width:0}
.correct button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600}
/* composer */
.composer{padding:10px 16px calc(14px + env(safe-area-inset-bottom))}
.box{max-width:820px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:10px 10px 8px 14px}
.box:focus-within{border-color:var(--accent)}
.box textarea{width:100%;border:0;outline:0;background:transparent;resize:none;max-height:200px;min-height:26px;line-height:1.5;padding:4px 0}
.row{display:flex;align-items:center;gap:8px;margin-top:4px}
.row .sp{flex:1}
.toggle{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent)}
.send{border:0;background:var(--accent);color:var(--accent-ink);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.send:disabled{opacity:.4;cursor:default}
.hint{max-width:820px;margin:6px auto 0;font-size:11.5px;color:var(--faint);text-align:center}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:280px;z-index:5;transform:translateX(-100%);transition:transform .2s;background:var(--bg)}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .top{display:flex}
  .suggest{grid-template-columns:1fr}
  .q{max-width:92%}
  .a{padding:14px}
  .scroll{padding:16px 12px 8px}
  .composer{padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 32 32"><path d="M9 22V10h6.5a5.5 5.5 0 0 1 0 11H9" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div><b>Deal Brain</b><small>Sparrow VC pipeline</small></div>
    </div>
    <button class="newchat" id="newchat"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New chat</button>
    <div class="chats" id="chats"></div>
    <div class="sidefoot">
      <div id="asof"><span class="dot"></span>Checking data…</div>
      <div id="quota"></div>
    </div>
  </aside>
  <main class="main">
    <div class="top">
      <button class="iconbtn" id="menu" aria-label="Open chats"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <b>Deal Brain</b>
      <button class="iconbtn" id="newchat2" aria-label="New chat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div class="scroll" id="scroll">
      <div id="banner"></div>
      <div class="thread" id="thread"></div>
    </div>
    <div class="composer">
      <form class="box" id="form">
        <textarea id="input" rows="1" placeholder="Ask about deals, founders, pass reasons, calls…" aria-label="Question"></textarea>
        <div class="row">
          <label class="toggle" title="Uses more reasoning for analytical questions. Slower."><input type="checkbox" id="deep"> Deep analysis</label>
          <span class="sp"></span>
          <button class="send" id="send" type="submit" aria-label="Send" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
      </form>
      <div class="hint">Answers come from the fund's Notion and Tracxn data in Supabase. Check important numbers with "Show query".</div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
// ---- Config: Supabase project and its public (anon) key. The key only lets the page call the "ask" function. ----
const API = "https://gdxufeytlxadbfzaorrx.supabase.co/functions/v1/ask";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkeHVmZXl0bHhhZGJmemFvcnJ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NTE3NjQsImV4cCI6MjEwNjIyNzc2NH0.-i0BrMu2cx8jDjG7cYCyQWGVOHRFicqYAhb2M9WP-sA";

const SUGGESTIONS = [
  ["Pass reasons", "Top pass reasons for fintech deals this year"],
  ["Founders", "Which passed startups had founders from Zomato?"],
  ["Calls", "What did True Machines say about unit economics?"],
  ["Trends", "Deals passed per month in the last 6 months, by F3 sector"],
];

const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let clientId = store.get("db_client", null);
if (!clientId) { clientId = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)); store.set("db_client", clientId); }
let chats = store.get("db_chats", []);          // [{id, title, turns:[{q, a, res}]}]
let currentId = store.get("db_current", null);
let busy = false;

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2600); }
function fmtDate(iso){ if (!iso) return "—"; const d = new Date(iso); return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) + ", " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); }
function fmtNum(v){ if (typeof v !== "number") return esc(v ?? ""); return Number.isInteger(v) ? v.toLocaleString() : v.toLocaleString(undefined, { maximumFractionDigits: 2 }); }
function saveChats(){ store.set("db_chats", chats.slice(0, 40)); store.set("db_current", currentId); }
const current = () => chats.find(c => c.id === currentId);

async function call(body){
  const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + ANON, "apikey": ANON },
    body: JSON.stringify({ client_id: clientId, ...body }) });
  let j = {}; try { j = await r.json(); } catch {}
  if (!r.ok) { const e = new Error(j.error || (r.status === 429 ? "Daily limit reached." : "Couldn't reach Deal Brain. Check your connection and try again.")); e.status = r.status; throw e; }
  return j;
}

// ---- Markdown-lite for answers ----
function md(text){
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  let html = "", inList = false;
  for (const raw of String(text).split(/\n/)) {
    const l = raw.trim();
    if (/^[-*•]\s+/.test(l)) { if (!inList) { html += "<ul>"; inList = true; } html += "<li>" + inline(l.replace(/^[-*•]\s+/, "")) + "</li>"; continue; }
    if (inList) { html += "</ul>"; inList = false; }
    if (!l) continue;
    if (/^scope:/i.test(l)) html += '<p class="scope">' + inline(l) + "</p>";
    else if (/^takeaway:/i.test(l)) html += '<p class="take"><b>Takeaway</b>' + inline(l.replace(/^takeaway:\s*/i, "")) + "</p>";
    else html += "<p>" + inline(l.replace(/^#+\s*/, "")) + "</p>";
  }
  if (inList) html += "</ul>";
  return html;
}

// ---- Chart from the result table (SVG, no libraries) ----
function chartFor(t, width){
  if (!t || !t.rows || t.rows.length < 2 || t.rows.length > 30) return "";
  const li = t.numeric.findIndex(n => !n); if (li < 0) return "";
  let vi = t.numeric.map((n, i) => n && i !== li ? i : -1).filter(i => i >= 0);
  // don't put percentages on the same axis as counts
  const counts = vi.filter(i => !/pct|percent|share|rate|ratio|avg|median/i.test(t.columns[i]));
  if (counts.length) vi = counts;
  const colMax = i => Math.max(...t.rows.map(r => Math.abs(Number(r[i]) || 0)));
  vi = vi.filter(i => colMax(i) >= colMax(vi[0]) / 8 && colMax(i) <= colMax(vi[0]) * 8).slice(0, 3);
  if (!vi.length) return "";
  const CW = Math.max(300, Math.round(width || 760));
  const labels = t.rows.map(r => String(r[li] ?? "—"));
  const isTime = labels.every(l => /^\d{4}(-\d{2})?(-\d{2})?/.test(l));
  const colors = ["var(--c1)", "var(--c2)", "var(--c3)"];
  const legend = vi.length > 1 ? '<div class="legend">' + vi.map((i, k) => `<span><i style="background:${colors[k]}"></i>${esc(t.columns[i].replace(/_/g, " "))}</span>`).join("") + "</div>" : "";
  const max = Math.max(...t.rows.flatMap(r => vi.map(i => Number(r[i]) || 0)), 0) || 1;
  if (isTime && t.rows.length >= 3) {
    const W = CW, H = CW < 500 ? 200 : 240, L = 44, R = 12, T = 12, B = 34, n = t.rows.length;
    const x = j => L + (n === 1 ? 0 : j * (W - L - R) / (n - 1)), y = v => T + (H - T - B) * (1 - v / max);
    let g = "";
    for (let k = 0; k <= 4; k++) { const v = max * k / 4, yy = y(v); g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end">${fmtNum(Math.round(v * 10) / 10)}</text>`; }
    const step = Math.ceil(n / (W < 500 ? 4 : 8));
    labels.forEach((l, j) => { if (j % step === 0 || j === n - 1) g += `<text x="${x(j)}" y="${H - 12}" text-anchor="middle">${esc(l.slice(0, 10))}</text>`; });
    vi.forEach((i, k) => {
      const pts = t.rows.map((r, j) => `${x(j)},${y(Number(r[i]) || 0)}`).join(" ");
      g += `<polyline points="${pts}" fill="none" stroke="${colors[k]}" stroke-width="2.2" stroke-linejoin="round"/>`;
      t.rows.forEach((r, j) => g += `<circle cx="${x(j)}" cy="${y(Number(r[i]) || 0)}" r="3" fill="${colors[k]}"><title>${esc(labels[j])}: ${fmtNum(r[i])}</title></circle>`);
    });
    return legend + `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart">${g}</svg>`;
  }
  // horizontal bars
  const rowH = vi.length > 1 ? 14 * vi.length + 10 : 24, W = CW, LW = Math.min(200, Math.round(CW * 0.34)), VW = 56, H = t.rows.length * rowH + 6;
  let g = "";
  t.rows.forEach((r, j) => {
    const y0 = j * rowH + 3;
    g += `<text class="lbl" x="${LW - 8}" y="${y0 + rowH / 2 + 1}" text-anchor="end" dominant-baseline="middle">${esc(labels[j].length > Math.floor(LW / 7) ? labels[j].slice(0, Math.floor(LW / 7) - 1) + "…" : labels[j])}<title>${esc(labels[j])}</title></text>`;
    vi.forEach((i, k) => {
      const v = Number(r[i]) || 0, w = Math.max(1, (W - LW - VW) * v / max), bh = vi.length > 1 ? 12 : 16, yy = y0 + (vi.length > 1 ? k * 14 + 3 : (rowH - bh) / 2);
      g += `<rect x="${LW}" y="${yy}" width="${w}" height="${bh}" rx="3" fill="${colors[k]}"><title>${esc(labels[j])}: ${fmtNum(r[i])}</title></rect><text x="${LW + w + 6}" y="${yy + bh / 2 + 1}" dominant-baseline="middle">${fmtNum(r[i])}</text>`;
    });
  });
  return legend + `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart">${g}</svg>`;
}

function tableHtml(t, sortCol, sortDir){
  let rows = t.rows.map((r, i) => ({ r, i }));
  if (sortCol != null) rows.sort((a, b) => { const x = a.r[sortCol], y = b.r[sortCol]; if (x == null) return 1; if (y == null) return -1; return (typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y))) * sortDir; });
  const head = t.columns.map((c, i) => `<th class="${t.numeric[i] ? "n" : ""}" data-col="${i}">${esc(c.replace(/_/g, " "))}${sortCol === i ? (sortDir > 0 ? " ↑" : " ↓") : ""}</th>`).join("");
  const body = rows.map(({ r }) => "<tr>" + r.map((v, i) => {
    if (t.numeric[i]) return `<td class="n">${fmtNum(v)}</td>`;
    const s = String(v ?? "");
    if (/^https?:\/\//.test(s)) return `<td><a href="${esc(s)}" target="_blank" rel="noopener">Open</a></td>`;
    return `<td><div class="clip" title="${esc(s.slice(0, 600))}">${esc(s)}</div></td>`;
  }).join("") + "</tr>").join("");
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}
function csv(t){
  const q = v => { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return [t.columns.map(q).join(","), ...t.rows.map(r => r.map(q).join(","))].join("\n");
}

// ---- Rendering ----
function renderSide(){
  const el = $("#chats");
  if (!chats.length) { el.innerHTML = ""; return; }
  el.innerHTML = "<h4>Recent</h4>" + chats.map(c => `<div class="chat-item ${c.id === currentId ? "on" : ""}" data-id="${c.id}" role="button" tabindex="0"><span>${esc(c.title)}</span><button class="x" data-del="${c.id}" aria-label="Delete chat">✕</button></div>`).join("");
}
function renderThread(){
  const th = $("#thread"); th.innerHTML = "";
  const c = current();
  if (!c || !c.turns.length) {
    th.innerHTML = `<div class="empty"><h1>What do you want to know?</h1><p>Ask in plain English about deals, founders, pass reasons, sectors or what was said on calls.</p>
      <div class="suggest">${SUGGESTIONS.map(([k, s]) => `<button data-q="${esc(s)}"><small>${esc(k)}</small>${esc(s)}</button>`).join("")}</div></div>`;
    return;
  }
  for (const t of c.turns) th.appendChild(turnEl(t));
}
function turnEl(t){
  const wrap = document.createElement("div"); wrap.style.display = "contents";
  const q = document.createElement("div"); q.className = "q"; q.textContent = t.q; wrap.appendChild(q);
  const a = document.createElement("div"); a.className = "a"; wrap.appendChild(a);
  t.el = a; paint(t);
  return wrap;
}
function paint(t){
  const a = t.el; if (!a) return;
  if (t.pending) { a.innerHTML = `<div class="thinking"><span class="pulse"></span><span>${esc(t.stage || "Reading the pipeline")}…</span></div>`; return; }
  if (t.error) { a.innerHTML = `<div class="err">${esc(t.error)}</div><div class="foot"><button class="fb" data-retry>Try again</button></div>`; a.querySelector("[data-retry]").onclick = () => retry(t); return; }
  const r = t.res;
  let h = `<div class="answer">${md(r.answer)}</div>`;
  const tb = r.table;
  const chart = chartFor(tb, a.clientWidth - 38);
  if (chart) h += `<div class="block chart"><div class="block-h">Chart</div>${chart}</div>`;
  if (tb && tb.rows && tb.rows.length) {
    h += `<div class="block"><div class="block-h">Data · ${tb.rows.length}${tb.truncated ? "+" : ""} rows<span class="sp"></span><button class="link" data-csv>Download CSV</button></div><div class="tablewrap">${tableHtml(tb, t.sortCol, t.sortDir || 1)}</div></div>`;
  }
  if (r.sources && r.sources.length) h += `<div class="block"><div class="block-h">Open in Notion</div><div class="chips">${r.sources.map(s => `<a class="chip" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.deal)}${s.status ? `<em>${esc(s.status)}</em>` : ""}</a>`).join("")}</div></div>`;
  if (r.followups && r.followups.length) h += `<div class="follow">${r.followups.map(f => `<button data-q="${esc(f)}">${esc(f)}</button>`).join("")}</div>`;
  h += `<div class="foot"><button class="fb" data-up aria-pressed="${t.rating === 1}" title="Good answer: save it as an example">👍</button><button class="fb" data-down aria-pressed="${t.rating === -1}" title="Something's wrong">👎</button>
        <button class="link" data-sql>${t.showSql ? "Hide query" : "Show query"}</button><span class="sp"></span><span>${(r.ms / 1000).toFixed(1)}s · data as of ${esc(fmtDate(r.data_as_of))}</span></div>
        <div class="correct ${t.correcting ? "on" : ""}"><input placeholder="What's wrong or what should it be? (optional)" maxlength="600"><button data-send-corr>Send</button></div>`;
  if (t.showSql) h += `<pre class="sql">${esc((r.sql || []).join("\n\n-- next query --\n\n") || "No database query was needed; answered from search results.")}</pre>`;
  a.innerHTML = h;
  a.querySelectorAll("th[data-col]").forEach(th => th.onclick = () => { const c = Number(th.dataset.col); t.sortDir = t.sortCol === c ? -(t.sortDir || 1) : (tb.numeric[c] ? -1 : 1); t.sortCol = c; paint(t); });
  const csvBtn = a.querySelector("[data-csv]"); if (csvBtn) csvBtn.onclick = () => { const b = new Blob([csv(tb)], { type: "text/csv" }); const u = URL.createObjectURL(b); const l = document.createElement("a"); l.href = u; l.download = "deal-brain.csv"; l.click(); setTimeout(() => URL.revokeObjectURL(u), 2000); };
  a.querySelector("[data-sql]").onclick = () => { t.showSql = !t.showSql; paint(t); };
  a.querySelector("[data-up]").onclick = () => feedback(t, 1, "");
  a.querySelector("[data-down]").onclick = () => { t.correcting = true; paint(t); a.querySelector(".correct input").focus(); };
  const sc = a.querySelector("[data-send-corr]"); if (sc) sc.onclick = () => feedback(t, -1, a.querySelector(".correct input").value);
}
async function feedback(t, rating, correction){
  try {
    await call({ action: "feedback", log_id: t.res.log_id, rating, correction });
    t.rating = rating; t.correcting = false; paint(t); saveChats();
    toast(rating === 1 ? "Saved as a good example. Similar questions will follow this approach." : "Thanks. The owner will review this.");
  } catch (e) { toast(e.message); }
}

// ---- Asking ----
const STAGES = ["Reading the pipeline", "Searching notes and calls", "Running the numbers", "Checking the result", "Writing the answer"];
async function ask(q){
  if (busy || !q.trim()) return;
  busy = true; $("#send").disabled = true;
  let c = current();
  if (!c) { c = { id: String(Date.now()), title: q.slice(0, 60), turns: [] }; chats.unshift(c); currentId = c.id; }
  if (!c.turns.length) $("#thread").innerHTML = "";
  const history = c.turns.filter(t => t.res).slice(-6).map(t => ({ q: t.q, a: t.res.answer }));
  const t = { q, pending: true, stage: STAGES[0] };
  c.turns.push(t); renderSide(); $("#thread").appendChild(turnEl(t)); scrollDown();
  let s = 0; const timer = setInterval(() => { s = Math.min(s + 1, STAGES.length - 1); t.stage = STAGES[s]; paint(t); }, 4500);
  try {
    t.res = await call({ question: q, history, deep: $("#deep").checked });
    if (t.res.quota) showQuota(t.res.quota);
  } catch (e) { t.error = e.message; }
  clearInterval(timer); t.pending = false; paint(t); saveChats(); scrollDown();
  busy = false; $("#send").disabled = !$("#input").value.trim();
}
function retry(t){ const c = current(); c.turns = c.turns.filter(x => x !== t); renderThread(); ask(t.q); }
function scrollDown(){ const s = $("#scroll"); requestAnimationFrame(() => s.scrollTop = s.scrollHeight); }
function showQuota(q){ if (q && q.limit) $("#quota").textContent = `${q.used} of ${q.limit} questions used today`; }

// ---- Wiring ----
const input = $("#input");
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 200) + "px"; $("#send").disabled = busy || !input.value.trim(); });
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#form").requestSubmit(); } });
$("#form").addEventListener("submit", e => { e.preventDefault(); const q = input.value.trim(); if (!q) return; input.value = ""; input.style.height = "auto"; ask(q); });
document.addEventListener("click", e => {
  const qb = e.target.closest("[data-q]"); if (qb && !busy) { ask(qb.dataset.q); return; }
  const del = e.target.closest("[data-del]"); if (del) { e.stopPropagation(); chats = chats.filter(c => c.id !== del.dataset.del); if (currentId === del.dataset.del) currentId = null; saveChats(); renderSide(); renderThread(); return; }
  const it = e.target.closest(".chat-item"); if (it) { currentId = it.dataset.id; saveChats(); renderSide(); renderThread(); $("#side").classList.remove("open"); scrollDown(); return; }
  if (e.target.closest("#side") === null && $("#side").classList.contains("open") && !e.target.closest("#menu")) $("#side").classList.remove("open");
});
const newChat = () => { if (busy) return; currentId = null; saveChats(); renderSide(); renderThread(); input.focus(); $("#side").classList.remove("open"); };
$("#newchat").onclick = newChat; $("#newchat2").onclick = newChat;
$("#menu").onclick = e => { e.stopPropagation(); $("#side").classList.toggle("open"); };

// stored turns lose their DOM link; drop unfinished ones
chats.forEach(c => c.turns = c.turns.filter(t => t.res || t.error).map(t => ({ ...t, el: null, pending: false })));
const _stringify = JSON.stringify;
store.set = (k, v) => { try { localStorage.setItem(k, _stringify(v, (key, val) => key === "el" ? undefined : val)); } catch {} };
renderSide(); renderThread();

(async () => {
  try {
    const m = await call({ action: "meta" });
    const at = m.meta?.data_as_of; const stale = at && (Date.now() - new Date(at)) > 3 * 864e5;
    $("#asof").innerHTML = `<span class="dot ${stale ? "stale" : ""}"></span>Data as of ${esc(fmtDate(at))}`;
    $("#asof").title = `${(m.meta?.deals || 0).toLocaleString()} deals · ${(m.meta?.with_transcript || 0).toLocaleString()} call transcripts`;
    showQuota(m.quota);
    if (!m.ready) $("#banner").innerHTML = `<div class="banner">Deal Brain is being set up and can't answer questions yet. Check back shortly.</div>`;
  } catch { $("#asof").innerHTML = `<span class="dot stale"></span>Couldn't reach the server`; }
})();
</script>
</body>
</html>
