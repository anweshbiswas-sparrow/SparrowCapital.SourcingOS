<html lang="en">
<head>
<meta charset="utf-8">

<title>Deal Brain</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#f7f6f2; --panel:#ffffff; --ink:#1d1d1b; --muted:#6b6a64; --faint:#9a988f; --line:#e6e3da; --soft:#f0eee7;
  --accent:#1f6f5c; --accent-ink:#ffffff; --accent-soft:#e3f0ec; --warn:#a1520f; --warn-soft:#fbf0e4; --bad:#b3261e;
  --user:#ece9e0; --c1:#1f6f5c; --c2:#c07a2c; --c3:#5a6fb0;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 18px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#161614; --panel:#1f1f1c; --ink:#ecebe6; --muted:#a8a69d; --faint:#7d7b73; --line:#33322e; --soft:#272724;
  --accent:#5cc2a6; --accent-ink:#0f1f1a; --accent-soft:#1d332d; --warn:#e3a35c; --warn-soft:#33281b; --bad:#f2847b;
  --user:#2b2a26; --c1:#5cc2a6; --c2:#e3a35c; --c3:#8fa2e0; --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#161614; --panel:#1f1f1c; --ink:#ecebe6; --muted:#a8a69d; --faint:#7d7b73; --line:#33322e; --soft:#272724;
  --accent:#5cc2a6; --accent-ink:#0f1f1a; --accent-soft:#1d332d; --warn:#e3a35c; --warn-soft:#33281b; --bad:#f2847b;
  --user:#2b2a26; --c1:#5cc2a6; --c2:#e3a35c; --c3:#8fa2e0; --shadow:none;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,textarea,input{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:260px 1fr;height:100dvh}
/* sidebar */
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 12px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.logo svg{width:18px;height:18px}
.brand b{font-size:16px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:-2px}
.newchat{margin:4px 12px 10px;padding:9px 12px;border:1px solid var(--line);background:var(--panel);border-radius:10px;cursor:pointer;display:flex;gap:8px;align-items:center;font-weight:500}
.newchat:hover{border-color:var(--faint)}
.chats{flex:1;overflow:auto;padding:0 8px 8px}
.chats h4{margin:10px 8px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600}
.chat-item{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;border:0;background:none;cursor:pointer;color:var(--ink);font-size:14px}
.chat-item span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item:hover{background:var(--soft)}
.chat-item.on{background:var(--accent-soft)}
.chat-item .x{opacity:0;border:0;background:none;cursor:pointer;color:var(--faint);padding:0 2px}
.chat-item:hover .x{opacity:1}
.sidefoot{border-top:1px solid var(--line);padding:12px 16px;font-size:12px;color:var(--muted);display:grid;gap:6px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
.dot.stale{background:var(--warn)}
/* main */
.main{display:flex;flex-direction:column;min-height:0;min-width:0}
.top{display:none;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.top b{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:9px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
.scroll{flex:1;overflow:auto;padding:24px 16px 8px}
.thread{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.banner{max-width:820px;margin:0 auto 16px;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:14px}
.empty{max-width:760px;margin:6vh auto 0;text-align:center}
.empty h1{font-size:28px;letter-spacing:-.02em;margin:0 0 6px;font-weight:650}
.empty p{color:var(--muted);margin:0 0 24px}
.suggest{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.suggest button{text-align:left}
.suggest button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:14px;line-height:1.4;box-shadow:var(--shadow)}
.suggest button:hover{border-color:var(--accent)}
.suggest small{display:block;color:var(--faint);font-size:12px;margin-bottom:2px}
.q{align-self:flex-end;max-width:80%;background:var(--user);padding:10px 14px;border-radius:16px 16px 4px 16px;white-space:pre-wrap;word-wrap:break-word}
.a{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.a .answer p{margin:0 0 8px}
.a .answer p:first-child{font-size:17px;line-height:1.45;font-weight:500}
.a .answer ul{margin:6px 0 8px;padding-left:20px}
.a .answer li{margin:3px 0}
.a .answer .scope{color:var(--muted);font-size:13px;margin-bottom:10px}
.a .answer .take{background:var(--accent-soft);border-radius:8px;padding:8px 10px;margin-top:10px;font-size:14px}
.a .answer .take b{color:var(--accent);margin-right:6px}
.a .answer code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:13px}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:p 1.1s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.err{color:var(--bad)}
.block{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.block-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.block-h .sp{flex:1}
.link{border:0;background:none;color:var(--accent);cursor:pointer;font-size:12px;font-weight:600;padding:2px 4px;text-transform:none;letter-spacing:0}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .lbl{fill:var(--ink)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tablewrap{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:10px}
.dblock.expanded .tablewrap{max-height:78vh}
.tablewrap table{width:max-content;min-width:100%}
.tablewrap td{min-width:64px;max-width:360px;white-space:normal}
.tablewrap td:not(.n):not(.rn){min-width:140px}
.dblock .block-h{flex-wrap:wrap;row-gap:6px}
.block-h .ttitle{text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--ink,var(--text));font-weight:650}
.badge{display:inline-block;margin-left:8px;border-radius:999px;padding:2px 9px;font-size:11px;letter-spacing:0;text-transform:none;font-weight:600;background:var(--soft);color:var(--muted)}
.badge.ok{background:var(--accent-soft);color:var(--accent)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.ttools{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.tsearch{flex:1;min-width:0;max-width:340px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;font-size:13px}
.tsearch:focus{outline:2px solid var(--accent);outline-offset:-1px}
td.rn,th.rn{color:var(--faint);text-align:right;width:1%;white-space:nowrap;font-variant-numeric:tabular-nums}
td.more{text-align:center;padding:10px}
details.long summary{cursor:pointer;list-style:none}
details.long summary::-webkit-details-marker{display:none}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;max-width:420px}
th{position:sticky;top:0;background:var(--soft);font-weight:600;cursor:pointer;white-space:nowrap;user-select:none}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td .clip{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;text-decoration:none;color:var(--ink);background:var(--panel)}
.chip:hover{border-color:var(--accent)}
.chip em{font-style:normal;color:var(--faint);font-size:11px}
pre.sql{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:12px;overflow:auto;white-space:pre-wrap;margin:6px 0 0;max-height:260px}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;font-size:12px;color:var(--faint)}
.foot .sp{flex:1}
.fb{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 9px;cursor:pointer;font-size:13px}
.fb[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.follow{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.follow button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px}
.follow button:hover{border-color:var(--accent)}
.correct{display:none;margin-top:10px;gap:8px}
.correct.on{display:flex}
.correct input{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;min-width:0}
.correct button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600}
/* composer */
.composer{padding:10px 16px calc(14px + env(safe-area-inset-bottom))}
.box{max-width:820px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:10px 10px 8px 14px}
.box:focus-within{border-color:var(--accent)}
.box textarea{width:100%;border:0;outline:0;background:transparent;resize:none;max-height:200px;min-height:26px;line-height:1.5;padding:4px 0}
.row{display:flex;align-items:center;gap:8px;margin-top:4px}
.row .sp{flex:1}
.toggle{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent)}
.send{border:0;background:var(--accent);color:var(--accent-ink);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.send:disabled{opacity:.4;cursor:default}
.hint{max-width:820px;margin:6px auto 0;font-size:11.5px;color:var(--faint);text-align:center}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.gate{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:20;padding:16px}
.gate[hidden]{display:none}
.gatebox{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px 28px;text-align:center;box-shadow:var(--shadow)}
.gatebox .logo{width:44px;height:44px;border-radius:12px;margin:0 auto 14px}
.gatebox .logo svg{width:26px;height:26px}
.gatebox h1{font-size:22px;margin:0 0 6px;letter-spacing:-.01em}
.gatebox p{color:var(--muted);margin:0 0 22px;font-size:14px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600;font-size:15px}
.gbtn:hover{border-color:var(--accent)}
.gatebox small{display:block;color:var(--faint);margin-top:14px;font-size:12px}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;font-weight:600;padding:6px}
.me{display:flex;align-items:center;gap:8px}
.me img,.me .av{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--accent);object-fit:cover}
.me span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-size:13px}
.chatview{display:flex;flex-direction:column;flex:1;min-height:0}
/* admin page (/admin) */
.adminpage{min-height:100dvh;display:flex;flex-direction:column}
.adminpage[hidden],.app[hidden]{display:none}
.ahead{position:sticky;top:0;z-index:4;background:var(--bg);border-bottom:1px solid var(--line)}
.ahead-in{max-width:1072px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px}
.ahead .brand{padding:0;flex:1;min-width:0}
.ahead .me{flex:0 1 auto;min-width:0}
.ahead .me span{max-width:220px}
.tochat{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 12px;font-size:14px;font-weight:500;color:var(--ink);text-decoration:none;white-space:nowrap}
.tochat:hover{border-color:var(--accent)}
.admin{flex:1;padding:22px 16px 40px}
.awrap{max-width:1040px;margin:0 auto}
.atabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 18px;overflow-x:auto}
.atabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.atabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi b{display:block;font-size:22px;letter-spacing:-.01em}
.kpi span{color:var(--muted);font-size:12px}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.frow input,.frow select,.card textarea,.set input,.set select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;min-width:0}
.frow input[type=email]{flex:1;min-width:200px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:none;border:1px solid var(--line);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;background:var(--soft);color:var(--muted)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:var(--warn-soft);color:var(--warn)}
.atable{width:100%;border-collapse:collapse;font-size:13px}
.atable th,.atable td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.atable th{position:static;background:none;color:var(--faint);font-weight:600;font-size:12px;cursor:default}
.atable td.n{text-align:right;font-variant-numeric:tabular-nums}
.atable input,.atable select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 6px;width:auto;max-width:110px}
.scrollx{overflow-x:auto}
.corr{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.corr .q{all:unset;display:block;font-weight:600;margin-bottom:6px}
.corr .ans{color:var(--muted);font-size:13px;white-space:pre-wrap;max-height:120px;overflow:auto;background:var(--soft);border-radius:8px;padding:8px;margin:6px 0}
.corr textarea{width:100%;min-height:60px;margin:6px 0;resize:vertical}
.set{display:grid;grid-template-columns:220px 1fr;gap:10px 16px;align-items:center}
.set label{color:var(--muted);font-size:13px}
.muted{color:var(--muted);font-size:13px}
.kpi small{display:block;color:var(--faint);font-size:12px;margin-top:2px}
.kpi.good b{color:var(--accent)}
.kpi.warn b{color:var(--warn)}
.pill.down{background:var(--warn-soft);color:var(--warn)}
.warnt{color:var(--warn);font-weight:600}
.ahead2{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.ahead2 h3{margin:0;font-size:15px;flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--panel);padding:7px 12px;cursor:pointer;font-size:13px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}
.flist{display:grid;gap:6px;margin-bottom:8px}
.frow2{display:flex;gap:10px;align-items:baseline;font-size:13px}
.frow2 .fn{min-width:28px;text-align:right;font-weight:700;color:var(--warn)}
.frow2 .fr{flex:1;word-break:break-word}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters select,.filters input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;min-height:36px}
.afsearch{flex:1;min-width:200px;display:flex}.afsearch input{flex:1;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.act{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.act summary{list-style:none;cursor:pointer;padding:12px 14px}
.act summary::-webkit-details-marker{display:none}
.act[open] summary{border-bottom:1px solid var(--line)}
.act-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px}
.act-top .sp{flex:1}
.act-q{font-weight:600;margin-top:6px}
.act-body{padding:12px 14px 14px}
.act-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600;margin:10px 0 6px}
.act-label:first-child{margin-top:0}
.act .answer p{margin:0 0 8px}.act .answer ul{margin:6px 0 8px;padding-left:20px}
.errbox,.notebox{border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:8px;word-break:break-word}
.errbox{background:var(--warn-soft)}.errbox b{color:var(--warn);display:block;margin-bottom:4px}
.notebox{background:var(--soft)}.notebox b{margin-right:6px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.steps div{background:var(--soft);border-radius:10px;padding:12px}
.steps b{display:block;margin-bottom:4px}.steps span{font-size:13px;color:var(--muted)}
.tl{display:grid;gap:12px}
.tl-i{border-left:2px solid var(--line);padding-left:12px}
.tl-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl-t{margin:4px 0 2px}
.mem{display:grid;gap:6px}
.mem-r{display:grid;grid-template-columns:minmax(120px,220px) 1fr 70px;gap:10px;align-items:center;font-size:13px}
.mem-r .n{text-align:right;font-variant-numeric:tabular-nums}
.mem-b{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}.mem-b i{display:block;height:100%;background:var(--c3)}
@media (max-width:820px){ .set{grid-template-columns:1fr} }

<script type="module">
const { createClient } = window.supabase; // loaded by the deferred script in <head>, which runs before this module
// ---- Config: Supabase project + public anon key (used only for sign-in). Every request to "ask" carries the signed-in user's token. ----
const SUPABASE_URL = "https://gdxufeytlxadbfzaorrx.supabase.co";
const API = SUPABASE_URL + "/functions/v1/ask";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkeHVmZXl0bHhhZGJmemFvcnJ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NTE3NjQsImV4cCI6MjEwNjIyNzc2NH0.-i0BrMu2cx8jDjG7cYCyQWGVOHRFicqYAhb2M9WP-sA";

const SUGGESTIONS = [
  ["Pass reasons", "Top pass reasons for fintech deals this year"],
  ["Founders", "Which passed startups had founders from Zomato?"],
  ["Calls", "What did True Machines say about unit economics?"],
  ["Trends", "Deals passed per month in the last 6 months, by F3 sector"],
];

const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const sb = createClient(SUPABASE_URL, ANON, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "pkce" } });
let session = null, me = null;
let chatKey = "db_chats", curKey = "db_current";
let chats = [];          // [{id, title, turns:[{q, a, res}]}]
let currentId = null;
let busy = false;

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2600); }
function fmtDate(iso){ if (!iso) return "—"; const d = new Date(iso); return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) + ", " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); }
function fmtNum(v){ if (typeof v !== "number") return esc(v ?? ""); return Number.isInteger(v) ? v.toLocaleString() : v.toLocaleString(undefined, { maximumFractionDigits: 2 }); }
// Saved chats keep at most 300 table rows per answer so long lists don't fill the browser's storage.
const trimTable = tb => tb && tb.rows && tb.rows.length > 300 ? { ...tb, rows: tb.rows.slice(0, 300), trimmed: tb.trimmed || tb.rows.length } : tb;
function saveChats(){
  const slim = chats.slice(0, 40).map(c => ({ ...c, turns: c.turns.map(t => t.res ? { ...t, el: null, res: { ...t.res, table: trimTable(t.res.table), tables: t.res.tables ? t.res.tables.map(trimTable) : t.res.tables } } : { ...t, el: null }) }));
  store.set(chatKey, slim); store.set(curKey, currentId);
}
const current = () => chats.find(c => c.id === currentId);

const READ_ACTIONS = new Set(["me", "admin_overview", "admin_activity", "admin_training", "admin_users", "admin_corrections", "admin_settings"]);
const dataCache = new Map(); // admin views: show what we have instantly, refresh in the background
function cget(body, maxAge = 60_000){
  const k = JSON.stringify(body), hit = dataCache.get(k);
  if (hit && Date.now() - hit.at < maxAge) return hit.p;
  const p = call(body); dataCache.set(k, { at: Date.now(), p });
  p.catch(() => dataCache.delete(k));
  return p;
}
async function call(body){
  if (!READ_ACTIONS.has(body.action || "ask") && String(body.action || "").startsWith("admin_")) dataCache.clear();
  const { data } = await sb.auth.getSession(); session = data.session;
  if (!session) { showGate("login"); throw new Error("Please sign in."); }
  const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + session.access_token, "apikey": ANON },
    body: JSON.stringify(body) });
  let j = {}; try { j = await r.json(); } catch {}
  if (!r.ok) {
    if (r.status === 401 || r.status === 403) { try { localStorage.removeItem(meKey(session?.user?.email)); } catch {} }
    if (r.status === 401) showGate("login", j.error);
    else if (j.code === "not_invited" || j.code === "blocked") showGate("denied", j.error);
    const e = new Error(j.error || (r.status === 429 ? "Daily limit reached." : "Couldn't reach Deal Brain. Check your connection and try again.")); e.status = r.status; throw e;
  }
  return j;
}

// ---- Markdown-lite for answers ----
// Safety net: internal table names should never reach the reader.
const FRIENDLY = { v_raw_data: "Raw Data", v_raw_data_content: "Raw Data", v_previous_company_list: "Raw Data (Previous Company Worked At)", v_f3_company_breakup: "Notion F3 Classification Company Breakup",
  nt_f3_company_breakup: "Notion F3 Classification Company Breakup", v_founder_employers: "founder career data", nt_deal_pipeline: "Deal Pipeline", v_deal_content: "deal pages",
  v_tracxn_fund: "Tracxn Fund", nt_tracxn_rounds: "Tracxn Fund", v_tracxn_companies: "Tracxn Fund", v_tracxn_missed_pattern: "Tracxn Fund (missed vs seen)", v_tracxn_missed_investors: "Tracxn Fund (investors)", tracxn_founders: "Tracxn founder data", v_local_snapshot: "Local Snapshot", nt_local_snapshot: "Local Snapshot", v_sector_wise_f3: "Sector Wise – F3",
  v_investor_missing_deals: "Investor Missing Deals", v_out_of_coverage_deals: "Out of Coverage Deals", v_f3_sector_super_master: "F3 Sector Super Master", v_startup_universe: "all Notion views" };
function friendly(text){ return String(text || "").replace(/`?\b((?:v|nt|mv)_[a-z0-9_]+)\b`?/g, (m, k) => FRIENDLY[k] || "the pipeline data"); }
function md(text){
  text = friendly(text);
  // A takeaway without a number is filler; leave it out.
  text = text.split("\n").filter(l => !(/^\s*Takeaway:/i.test(l) && !/\d/.test(l))).join("\n");
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  let html = "", inList = false;
  for (const raw of String(text).split(/\n/)) {
    const l = raw.trim();
    if (/^[-*•]\s+/.test(l)) { if (!inList) { html += "<ul>"; inList = true; } html += "<li>" + inline(l.replace(/^[-*•]\s+/, "")) + "</li>"; continue; }
    if (inList) { html += "</ul>"; inList = false; }
    if (!l) continue;
    if (/^scope:/i.test(l)) html += '<p class="scope">' + inline(l) + "</p>";
    else if (/^takeaway:/i.test(l)) html += '<p class="take"><b>Takeaway</b>' + inline(l.replace(/^takeaway:\s*/i, "")) + "</p>";
    else html += "<p>" + inline(l.replace(/^#+\s*/, "")) + "</p>";
  }
  if (inList) html += "</ul>";
  return html;
}

// ---- Chart from the result table (SVG, no libraries) ----
function chartFor(t, width){
  if (!t || !t.rows || t.rows.length < 2 || t.rows.length > 30) return "";
  const li = t.numeric.findIndex(n => !n); if (li < 0) return "";
  let vi = t.numeric.map((n, i) => n && i !== li ? i : -1).filter(i => i >= 0);
  // don't put percentages on the same axis as counts
  const counts = vi.filter(i => !/pct|percent|share|rate|ratio|avg|median/i.test(t.columns[i]));
  if (counts.length) vi = counts;
  const colMax = i => Math.max(...t.rows.map(r => Math.abs(Number(r[i]) || 0)));
  vi = vi.filter(i => colMax(i) >= colMax(vi[0]) / 8 && colMax(i) <= colMax(vi[0]) * 8).slice(0, 3);
  if (!vi.length) return "";
  const CW = Math.max(300, Math.round(width || 760));
  const labels = t.rows.map(r => String(r[li] ?? "—"));
  const isTime = labels.every(l => /^\d{4}(-\d{2})?(-\d{2})?/.test(l));
  const colors = ["var(--c1)", "var(--c2)", "var(--c3)"];
  const legend = vi.length > 1 ? '<div class="legend">' + vi.map((i, k) => `<span><i style="background:${colors[k]}"></i>${esc(t.columns[i].replace(/_/g, " "))}</span>`).join("") + "</div>" : "";
  const max = Math.max(...t.rows.flatMap(r => vi.map(i => Number(r[i]) || 0)), 0) || 1;
  if (isTime && t.rows.length >= 3) {
    const W = CW, H = CW < 500 ? 200 : 240, L = 44, R = 12, T = 12, B = 34, n = t.rows.length;
    const x = j => L + (n === 1 ? 0 : j * (W - L - R) / (n - 1)), y = v => T + (H - T - B) * (1 - v / max);
    let g = "";
    for (let k = 0; k <= 4; k++) { const v = max * k / 4, yy = y(v); g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end">${fmtNum(Math.round(v * 10) / 10)}</text>`; }
    const step = Math.ceil(n / (W < 500 ? 4 : 8));
    labels.forEach((l, j) => { if (j % step === 0 || j === n - 1) g += `<text x="${x(j)}" y="${H - 12}" text-anchor="middle">${esc(l.slice(0, 10))}</text>`; });
    vi.forEach((i, k) => {
      const pts = t.rows.map((r, j) => `${x(j)},${y(Number(r[i]) || 0)}`).join(" ");
      g += `<polyline points="${pts}" fill="none" stroke="${colors[k]}" stroke-width="2.2" stroke-linejoin="round"/>`;
      t.rows.forEach((r, j) => g += `<circle cx="${x(j)}" cy="${y(Number(r[i]) || 0)}" r="3" fill="${colors[k]}"><title>${esc(labels[j])}: ${fmtNum(r[i])}</title></circle>`);
    });
    return legend + `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart">${g}</svg>`;
  }
  // horizontal bars
  const rowH = vi.length > 1 ? 14 * vi.length + 10 : 24, W = CW, LW = Math.min(200, Math.round(CW * 0.34)), VW = 56, H = t.rows.length * rowH + 6;
  let g = "";
  t.rows.forEach((r, j) => {
    const y0 = j * rowH + 3;
    g += `<text class="lbl" x="${LW - 8}" y="${y0 + rowH / 2 + 1}" text-anchor="end" dominant-baseline="middle">${esc(labels[j].length > Math.floor(LW / 7) ? labels[j].slice(0, Math.floor(LW / 7) - 1) + "…" : labels[j])}<title>${esc(labels[j])}</title></text>`;
    vi.forEach((i, k) => {
      const v = Number(r[i]) || 0, w = Math.max(1, (W - LW - VW) * v / max), bh = vi.length > 1 ? 12 : 16, yy = y0 + (vi.length > 1 ? k * 14 + 3 : (rowH - bh) / 2);
      g += `<rect x="${LW}" y="${yy}" width="${w}" height="${bh}" rx="3" fill="${colors[k]}"><title>${esc(labels[j])}: ${fmtNum(r[i])}</title></rect><text x="${LW + w + 6}" y="${yy + bh / 2 + 1}" dominant-baseline="middle">${fmtNum(r[i])}</text>`;
    });
  });
  return legend + `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart">${g}</svg>`;
}

// Column names arrive either as "Readable names" (preferred) or snake_case; show them readably.
const COL_NAMES = { deals: "Deals", founders: "Founders", founding_teams: "Founding teams", pass_stages: "Pass stages", company: "Company", deal: "Deal", startup: "Startup",
  stage_first_call: "First Call", stage_multiple_calls: "Multiple Calls", stage_deck_scan: "Deck Scan", stage_first_call_data: "First Call + Data", stage_diligence_or_later: "Diligence or later", stage_not_set: "Stage not set",
  to_be_passed: "To be Passed", passed: "Passed", f3_split: "F3 split", meeting_date: "Meeting date", created_date: "Created", pass_reason: "Pass reason", pass_type: "Pass type", sector: "Sector" };
function colName(c){ const k = String(c); if (COL_NAMES[k.toLowerCase()]) return COL_NAMES[k.toLowerCase()]; if (/[A-Z ]/.test(k)) return k; const t = k.replace(/_/g, " "); return t.charAt(0).toUpperCase() + t.slice(1); }
const RENDER_CAP = 3000; // rows drawn at once; search always covers every row
// st = per-table view state (filter, sort, showAll, expanded); tb = the table itself.
function viewRows(tb, st){
  let rows = tb.rows.map((r, i) => ({ r, i }));
  const q = (st.filter || "").trim().toLowerCase();
  if (q) rows = rows.filter(({ r }) => r.some(v => v != null && String(v).toLowerCase().includes(q)));
  if (st.sortCol != null) { const c = st.sortCol, d = st.sortDir || 1; rows.sort((a, b) => { const x = a.r[c], y = b.r[c]; if (x == null) return 1; if (y == null) return -1; return (typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y))) * d; }); }
  return rows;
}
function cellHtml(v, numeric){
  if (numeric) return `<td class="n">${fmtNum(v)}</td>`;
  const s = String(v ?? "");
  if (/^https?:\/\//.test(s)) return `<td><a href="${esc(s)}" target="_blank" rel="noopener">Open</a></td>`;
  if (s.length > 180) return `<td><details class="long"><summary>${esc(s.slice(0, 160))}…</summary>${esc(s)}</details></td>`;
  return `<td>${esc(s)}</td>`;
}
function tbodyHtml(tb, st){
  const rows = viewRows(tb, st), cap = st.showAll ? rows.length : Math.min(rows.length, RENDER_CAP);
  const body = rows.slice(0, cap).map(({ r }, n) => `<tr><td class="rn">${n + 1}</td>${r.map((v, i) => cellHtml(v, tb.numeric[i])).join("")}</tr>`).join("");
  const more = rows.length > cap ? `<tr><td colspan="${tb.columns.length + 1}" class="more"><button class="link" data-showall>Show all ${rows.length.toLocaleString()} rows</button></td></tr>` : "";
  const empty = !rows.length ? `<tr><td colspan="${tb.columns.length + 1}" class="muted">No rows match “${esc(st.filter)}”.</td></tr>` : "";
  return { html: body + more + empty, shown: rows.length };
}
function tableHtml(tb, st){
  const head = `<th class="rn">#</th>` + tb.columns.map((c, i) => `<th class="${tb.numeric[i] ? "n" : ""}" data-col="${i}" title="Sort">${esc(colName(c))}${st.sortCol === i ? ((st.sortDir || 1) > 0 ? " ↑" : " ↓") : ""}</th>`).join("");
  return `<table><thead><tr>${head}</tr></thead><tbody>${tbodyHtml(tb, st).html}</tbody></table>`;
}
function csv(t){
  const q = v => { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return [t.columns.map(c => q(colName(c))).join(","), ...t.rows.map(r => r.map(q).join(","))].join("\n");
}

// ---- Rendering ----
function renderSide(){
  const el = $("#chats");
  if (!chats.length) { el.innerHTML = ""; return; }
  el.innerHTML = "<h4>Recent</h4>" + chats.map(c => `<div class="chat-item ${c.id === currentId ? "on" : ""}" data-id="${c.id}" role="button" tabindex="0"><span>${esc(c.title)}</span><button class="x" data-del="${c.id}" aria-label="Delete chat">✕</button></div>`).join("");
}
function renderThread(){
  const th = $("#thread"); th.innerHTML = "";
  const c = current();
  if (!c || !c.turns.length) {
    th.innerHTML = `<div class="empty"><h1>What do you want to know?</h1><p>Ask in plain English about deals, founders, pass reasons, sectors or what was said on calls.</p>
      <div class="suggest">${SUGGESTIONS.map(([k, s]) => `<button data-q="${esc(s)}"><small>${esc(k)}</small>${esc(s)}</button>`).join("")}</div></div>`;
    return;
  }
  for (const t of c.turns) th.appendChild(turnEl(t));
}
function turnEl(t){
  const wrap = document.createElement("div"); wrap.style.display = "contents";
  const q = document.createElement("div"); q.className = "q"; q.textContent = t.q; wrap.appendChild(q);
  const a = document.createElement("div"); a.className = "a"; wrap.appendChild(a);
  t.el = a; paint(t);
  return wrap;
}
function paint(t){
  const a = t.el; if (!a) return;
  if (t.pending) { a.innerHTML = `<div class="thinking"><span class="pulse"></span><span>${esc(t.stage || "Reading the pipeline")}…</span></div>`; return; }
  if (t.error) { a.innerHTML = `<div class="err">${esc(t.error)}</div><div class="foot"><button class="fb" data-retry>Try again</button></div>`; a.querySelector("[data-retry]").onclick = () => retry(t); return; }
  const r = t.res;
  let h = `<div class="answer">${md(r.answer)}</div>`;
  // One data block per titled table (multi-part questions); otherwise the single result table.
  let list = (r.tables && r.tables.length ? r.tables : (r.table ? [r.table] : [])).filter(x => x && x.rows && x.rows.length);
  // With several tables, single-number helper results (e.g. a total) are already in the text; don't show them as tables.
  if (list.length > 1) { const big = list.filter(x => !(x.rows.length === 1 && x.columns.length <= 2)); if (big.length) list = big; }
  t.tstate = t.tstate || [];
  const states = list.map((_, i) => (list.length === 1 && !r.tables?.length) ? t : (t.tstate[i] = t.tstate[i] || {}));
  const chartSrc = list.find(x => chartFor(x, 400));
  const chart = chartSrc ? chartFor(chartSrc, (a.clientWidth || $("#thread").clientWidth || 760) - 38) : "";
  if (chart) h += `<div class="block chart"><div class="block-h">Chart${chartSrc.title ? ` · ${esc(chartSrc.title)}` : ""}</div>${chart}</div>`;
  list.forEach((tb, i) => {
    const st = states[i], total = tb.trimmed || tb.rows.length;
    const badge = tb.truncated ? `<span class="badge warn">First ${total.toLocaleString()} rows — ask a narrower question for the rest</span>`
      : tb.trimmed ? `<span class="badge">Complete: ${total.toLocaleString()} rows · first ${tb.rows.length} kept in this saved chat</span>`
      : `<span class="badge ok">Complete: ${total.toLocaleString()} ${total === 1 ? "row" : "rows"}</span>`;

      ${kpi("$" + Number(k.est_cost_usd || 0).toFixed(2), "estimated AI cost", (k.tokens_in + k.tokens_out).toLocaleString() + " tokens")}
    </div>
    <div class="card"><h3>Questions per day</h3>${barChart(o.series, [{ key: "answered", label: "answered", color: "var(--c1)" }, { key: "failed", label: "failed", color: "var(--c2)" }], "day", { aria: "Questions answered and failed per day" })}</div>
    <div class="card"><h3>Answer feedback</h3>
      <div class="split">${[["up", "Upvoted", "var(--c1)"], ["down", "Downvoted", "var(--c2)"], ["unrated", "Not rated", "var(--faint)"]].map(([kk, l, c]) => k[kk] ? `<span style="flex:${k[kk]};background:${c}" title="${l}: ${k[kk]}"></span>` : "").join("") || `<span style="flex:1;background:var(--soft)"></span>`}</div>
      <div class="legend" style="margin-top:8px"><span><i style="background:var(--c1)"></i>Upvoted ${k.up}</span><span><i style="background:var(--c2)"></i>Downvoted ${k.down}</span><span><i style="background:var(--faint)"></i>Not rated ${k.unrated}</span></div>
      <p class="muted" style="margin:6px 0 0">${rated ? `${pct(k.up, rated)} of rated answers were upvoted.` : "No answers have been rated yet. Ask the team to use the thumbs on each answer; that is how the brain learns."}</p></div>
    <div class="card scrollx"><h3>Who's asking</h3><table class="atable"><thead><tr><th>Person</th><th class="n">Asked</th><th class="n">Answered</th><th class="n">Failed</th><th class="n">Upvoted</th><th class="n">Downvoted</th><th class="n">Avg time</th><th>Last question</th><th></th></tr></thead><tbody>
      ${o.people.map(x => `<tr><td><b>${esc(x.name || x.email)}</b>${x.name ? `<div class="muted">${esc(x.email)}</div>` : ""}</td><td class="n">${x.asked}</td><td class="n">${x.answered}</td><td class="n ${x.failed ? "warnt" : ""}">${x.failed}</td><td class="n">${x.up}</td><td class="n">${x.down}</td><td class="n">${secs(x.avg_ms)}</td><td class="muted">${esc(ago(x.last))}</td>
        <td>${x.email.includes("@") ? `<button class="linkbtn" data-person="${esc(x.email)}">See questions</button>` : ""}</td></tr>`).join("") || `<tr><td colspan="9" class="muted">No questions in this period.</td></tr>`}</tbody></table></div>
    <div class="card"><h3>Why questions failed</h3>
      ${o.failures.length ? `<div class="flist">${o.failures.map(f => `<div class="frow2"><span class="fn">${f.n}</span><span class="fr">${esc(f.reason)}${f.reason.length >= 90 ? "…" : ""}</span><span class="muted">${esc(ago(f.last))}</span></div>`).join("")}</div>
        <button class="linkbtn" id="seefailed">See every failed question</button>` : `<p class="muted" style="margin:0">No failures in this period.</p>`}</div>`;
  $("#ovrange").onclick = e => { const b = e.target.closest("[data-d]"); if (b) { ovDays = Number(b.dataset.d); loadTab(); } };
  p.querySelectorAll("[data-person]").forEach(b => b.onclick = () => { Object.assign(actState, { user: b.dataset.person, status: "all", q: "" }); goTab("activity"); });
  const sf = $("#seefailed"); if (sf) sf.onclick = () => { Object.assign(actState, { user: "", status: "failed", q: "" }); goTab("activity"); };
}

function activityItem(r){
  const sq = r.sqls || [];
  return `<details class="act"><summary>
      <div class="act-top">${statusPill(r)}<span class="muted">${esc(r.who || "")}</span><span class="muted">· ${esc(when(r.created_at))}</span><span class="sp"></span>
        <span class="muted">${r.error ? "" : (r.row_count ?? 0) + (r.row_count === 1 ? " row · " : " rows · ")}${secs(r.ms)}</span></div>
      <div class="act-q">${esc(r.question)}</div></summary>
    <div class="act-body">
      ${r.error ? `<div class="errbox"><b>Why it failed</b><div>${esc(r.error)}</div></div>` : `<div class="act-label">Output shown to ${esc(r.who || "them")}</div><div class="answer">${md(r.answer || "")}</div>`}
      ${r.rating === -1 ? `<div class="notebox"><b>Their correction</b> <span class="pill">${esc(r.correction_status || "pending")}</span><div>${esc(r.correction || "(no note left)")}</div></div>` : ""}
      ${sq.length ? `<div class="act-label">Database ${sq.length === 1 ? "query" : "queries"} the AI ran (${sq.length})</div><pre class="sql">${esc(sq.join("\n\n-- next query --\n"))}</pre>` : ""}
      <div class="muted" style="font-size:12px;margin-top:8px">#${esc(r.id)} · ${esc(r.model || "")} · ${(r.tokens_in || 0).toLocaleString()} in / ${(r.tokens_out || 0).toLocaleString()} out tokens</div>
    </div></details>`;
}
async function tabActivity(p){
  const first = await cget({ action: "admin_activity", ...actState, limit: 30 });
  const S = [["all", "All"], ["answered", "Answered"], ["failed", "Failed"], ["up", "Upvoted"], ["down", "Downvoted"], ["unrated", "Not rated"]];
  p.innerHTML = `<div class="card"><div class="filters">
      <label class="sr" for="afuser">Person</label><select id="afuser"><option value="">Everyone</option>${first.users.map(u => `<option ${u === actState.user ? "selected" : ""}>${esc(u)}</option>`).join("")}</select>
      <div class="seg" id="afstatus">${S.map(([v, l]) => `<button data-s="${v}" class="${v === actState.status ? "on" : ""}">${l}</button>`).join("")}</div>
      <form id="afsearch" class="afsearch"><label class="sr" for="afq">Search</label><input id="afq" type="search" placeholder="Search questions and answers" value="${esc(actState.q)}"></form>
    </div></div>
    <p class="muted" style="margin:0 0 10px">Every question the team has asked, newest first. Open one to see the exact answer they got, the queries behind it, and any feedback.</p>
    <div id="alist"></div><div style="text-align:center;margin-top:12px"><button class="btn ghost" id="amore" hidden>Load more</button></div>`;
  let rows = first.rows;
  const draw = more => { $("#alist").innerHTML = rows.length ? rows.map(activityItem).join("") : `<div class="card muted">No questions match these filters.</div>`; $("#amore").hidden = !more; };
  draw(first.more);
  $("#afuser").onchange = e => { actState.user = e.target.value; loadTab(); };
  $("#afstatus").onclick = e => { const b = e.target.closest("[data-s]"); if (b) { actState.status = b.dataset.s; loadTab(); } };
  $("#afsearch").onsubmit = e => { e.preventDefault(); actState.q = $("#afq").value.trim(); loadTab(); };
  $("#amore").onclick = async () => {
    $("#amore").disabled = true;
    try { const nx = await call({ action: "admin_activity", ...actState, limit: 30, before_id: rows[rows.length - 1].id }); rows = rows.concat(nx.rows); draw(nx.more); }
    catch (er) { toast(er.message); } finally { $("#amore").disabled = false; }
  };
}

const EV = {
  example: ["Learned from an upvote", "ok", "Saved as a worked example. Similar questions now follow this answer's approach."],
  rule: ["Team rule added", "ok", "The AI follows this on every answer."],
  rule_off: ["Team rule (switched off)", "", "Not applied right now."],
  correction_pending: ["Downvote waiting for review", "bad", "Approve it in Corrections to turn it into a rule."],
  correction_approved: ["Downvote approved as a rule", "ok", ""],
  correction_dismissed: ["Downvote dismissed", "", "No change to the brain."],
};
async function tabTraining(p){
  const t = await cget({ action: "admin_training" });
  const T = t.totals;
  const KN = { transcript: "Call transcripts", call_notes: "Call notes", deal: "Deals", call_summary: "Call summaries", funding_round: "Funding rounds (Tracxn)", founder: "Founders", investor_f3_breakup: "F3 investor breakup", f3_master: "F3 master", alumni_pattern: "Alumni patterns", investor_missed: "Investors missed", out_of_coverage: "Out of coverage", answer_example: "Worked examples (from upvotes)", insight: "Saved insights" };
  const kmax = Math.max(1, ...t.kinds.map(x => x.n));
  p.innerHTML = `<div class="card"><h3>How Deal Brain learns</h3>
      <div class="steps">
        <div><b>1 · Upvote</b><span>An upvoted answer is saved straight into memory as a worked example. When someone asks something similar, the AI is shown that example and follows the same approach.</span></div>
        <div><b>2 · Downvote + note</b><span>A downvote with a note goes to Corrections. When an admin approves it, it becomes a team rule the AI follows on every answer. Nothing changes until it's approved.</span></div>
        <div><b>3 · Nightly sync</b><span>Every night at 2:00 AM IST, Notion and Tracxn data is re-synced and the searchable memory is rebuilt, so new deals, notes and calls are included.</span></div>
      </div></div>
    <div class="kpis">
      ${kpi(T.examples, "worked examples", T.examples_pending ? T.examples_pending + " still being indexed" : "learned from upvotes", "good")}
      ${kpi(T.rules_active, "active team rules", T.rules_off ? T.rules_off + " switched off" : "from approved corrections")}
      ${kpi(T.corr_pending, "corrections to review", T.corr_pending ? `<button class="linkbtn" id="gocorr">Review now</button>` : "nothing waiting", T.corr_pending ? "warn" : "")}
      ${kpi(T.corr_approved + " / " + T.corr_dismissed, "corrections approved / dismissed", "")}
      ${kpi(T.memory_docs.toLocaleString(), "documents in memory", "refreshed " + esc(ago(T.memory_updated)))}
    </div>
    <div class="card"><h3>Learning per week</h3>${barChart(t.weeks, [{ key: "examples", label: "examples from upvotes", color: "var(--c1)" }, { key: "rules", label: "rules added", color: "var(--c3)" }, { key: "downvotes", label: "downvotes", color: "var(--c2)" }], "week", { stacked: false, h: 160, aria: "Examples, rules and downvotes per week" })}</div>
    <div class="card"><h3>Recent learning</h3>
      ${t.events.length ? `<div class="tl">${t.events.map(e => { const [l, c, d] = EV[e.type] || [e.type, "", ""]; return `<div class="tl-i"><div class="tl-h"><span class="pill ${c}">${esc(l)}</span><span class="muted">${esc(e.who || "")} · ${esc(when(e.at))}</span></div>
          <div class="tl-t">${esc(e.text || "")}</div>${e.type.startsWith("correction") && e.detail ? `<div class="muted">Note: ${esc(e.detail)}</div>` : ""}${d ? `<div class="muted" style="font-size:12px">${esc(d)}</div>` : ""}</div>`; }).join("")}</div>`
        : `<p class="muted" style="margin:0">Nothing learned yet. Upvotes and approved corrections will show up here.</p>`}</div>
    <div class="card"><h3>What's in memory</h3><div class="mem">${t.kinds.map(x => `<div class="mem-r"><span>${esc(KN[x.kind] || x.kind)}</span><span class="mem-b"><i style="width:${Math.max(1, 100 * x.n / kmax)}%"></i></span><span class="n">${x.n.toLocaleString()}</span></div>`).join("")}</div></div>`;
  const gc = $("#gocorr"); if (gc) gc.onclick = () => goTab("corrections");
}
async function tabCorrections(p){
  const { items, rules } = await cget({ action: "admin_corrections" });
  const pending = items.filter(i => i.status === "pending");
  p.innerHTML = `<div class="card"><h3>${pending.length} correction${pending.length === 1 ? "" : "s"} to review</h3>
      <p class="muted" style="margin-top:0">When someone gives 👎 with a note, it lands here. Approving turns your wording into a team rule the AI follows on every answer.</p>
      ${pending.map(i => `<div class="corr" data-id="${i.id}"><div class="q">${esc(i.question)}</div><div class="muted">${esc(i.who || "")} · ${esc(ago(i.created_at))}</div>
        <div class="ans">${esc(i.answer || "")}</div><div><b>Their note:</b> ${esc(i.correction || "(no note)")}</div>
        <textarea placeholder="Rule for the AI, e.g. 'Count Pass and To be Passed together as passed deals'">${esc(i.correction || "")}</textarea>
        <div class="frow"><button class="btn" data-approve>Approve as rule</button><button class="btn ghost" data-dismiss>Dismiss</button></div></div>`).join("") || `<p class="muted">Nothing waiting.</p>`}
    </div>
    <div class="card"><h3>Team rules (${rules.filter(r => r.active).length} active)</h3>
      <form class="frow" id="addrule" style="margin-bottom:10px"><input name="rule" placeholder="Add a rule the AI must always follow" style="flex:1;min-width:240px"><button class="btn">Add rule</button></form>
      <div class="scrollx"><table class="atable"><tbody>${rules.map(r => `<tr><td><label style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" data-rule="${r.id}" ${r.active ? "checked" : ""}> <span>${esc(r.rule)}</span></label><div class="muted">${esc(r.source || "")} · ${esc(fmtDate(r.created_at))}</div></td></tr>`).join("") || `<tr><td class="muted">No rules yet.</td></tr>`}</tbody></table></div></div>
    ${items.length > pending.length ? `<div class="card"><h3>Resolved</h3>${items.filter(i => i.status !== "pending").slice(0, 20).map(i => `<div class="muted" style="margin:4px 0"><span class="pill ${i.status === "approved" ? "ok" : ""}">${esc(i.status)}</span> ${esc(i.question)}</div>`).join("")}</div>` : ""}`;
  p.querySelectorAll(".corr").forEach(c => {
    c.querySelector("[data-approve]").onclick = async () => { try { await call({ action: "admin_correction_resolve", id: Number(c.dataset.id), decision: "approve", rule: c.querySelector("textarea").value }); toast("Rule added. The AI follows it from the next question."); loadTab(); } catch (er) { toast(er.message); } };
    c.querySelector("[data-dismiss]").onclick = async () => { try { await call({ action: "admin_correction_resolve", id: Number(c.dataset.id), decision: "dismiss" }); loadTab(); } catch (er) { toast(er.message); } };
  });
  p.querySelectorAll("[data-rule]").forEach(cb => cb.onchange = async () => { try { await call({ action: "admin_rule_toggle", id: Number(cb.dataset.rule), active: cb.checked }); toast(cb.checked ? "Rule on." : "Rule off."); } catch (er) { toast(er.message); cb.checked = !cb.checked; } });
  $("#addrule").onsubmit = async e => { e.preventDefault(); const r = new FormData(e.target).get("rule"); try { await call({ action: "admin_rule_add", rule: r }); toast("Rule added."); loadTab(); } catch (er) { toast(er.message); } };
}
async function tabSettings(p){
  const { settings: st, keys, meta, syncs } = await cget({ action: "admin_settings" });
  p.innerHTML = `<div class="card"><h3>App</h3><form class="set" id="setf">
      <label>Deal Brain is</label><select name="enabled"><option value="true" ${st.enabled !== false ? "selected" : ""}>On: team can ask questions</option><option value="false" ${st.enabled === false ? "selected" : ""}>Paused</option></select>
      <label>AI provider</label><select name="provider"><option value="gemini" ${st.provider !== "openai" ? "selected" : ""}>Google Gemini ${keys.gemini ? "" : "(no key set)"}</option><option value="openai" ${st.provider === "openai" ? "selected" : ""}>OpenAI ${keys.openai ? "" : "(no key set)"}</option></select>
      <label>Gemini model</label><input name="gemini_model" value="${esc(st.gemini_model || "")}">
      <label>OpenAI model</label><input name="model" value="${esc(st.model || "")}">
      <label>Switch provider if the main one fails</label><select name="fallback"><option value="true" ${st.fallback !== false ? "selected" : ""}>Yes</option><option value="false" ${st.fallback === false ? "selected" : ""}>No</option></select>
      <label>Default questions per person per day</label><input name="per_client_day" type="number" min="0" value="${st.per_client_day ?? 40}">
      <label>Team questions per day</label><input name="global_day" type="number" min="0" value="${st.global_day ?? 400}">
      <label>Price per 1M input tokens (USD)</label><input name="price_in_per_mtok" type="number" step="0.01" min="0" value="${st.price_in_per_mtok ?? 0}">
      <label>Price per 1M output tokens (USD)</label><input name="price_out_per_mtok" type="number" step="0.01" min="0" value="${st.price_out_per_mtok ?? 0}">
      <span></span><div><button class="btn">Save settings</button></div></form></div>
    <div class="card scrollx"><h3>Data</h3><p class="muted" style="margin-top:0">${(meta.deals || 0).toLocaleString()} deals · ${(meta.raw_data || 0).toLocaleString()} in Raw Data · ${(meta.with_transcript || 0).toLocaleString()} with call transcripts. Notion syncs nightly at 2:00 AM IST.</p>
      <table class="atable"><thead><tr><th>Source</th><th>Last sync</th><th>Status</th><th class="n">Rows</th></tr></thead><tbody>
      ${syncs.map(r => `<tr><td>${esc(r.source)}</td><td class="muted">${esc(fmtDate(r.finished_at))}</td><td>${r.ok ? `<span class="pill ok">ok</span>` : `<span class="pill bad" title="${esc(r.error || "")}">failed</span>`}</td><td class="n">${(r.rows_synced ?? 0).toLocaleString()}</td></tr>`).join("")}</tbody></table></div>`;
  $("#setf").onsubmit = async e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
    f.enabled = f.enabled === "true"; f.fallback = f.fallback === "true";
    try { await call({ action: "admin_settings_save", settings: f }); toast("Settings saved."); loadTab(); } catch (er) { toast(er.message); } };
}
</script>
</body>
</html>
